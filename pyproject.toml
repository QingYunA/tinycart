[project]
name = "tinycart"
version = "0.1.0"
description = "A tiny cart-total CLI used to demo an agent verification pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tinycart = "tinycart.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.96"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
